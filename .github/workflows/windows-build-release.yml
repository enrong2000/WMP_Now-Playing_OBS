name: Windows Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
      - "*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      obs_version:
        description: "OBS Studio tag used to build libobs"
        required: false
        default: "32.1.2"

permissions:
  contents: read

concurrency:
  group: windows-build-release-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_NAME: obs-wmp-smtc
  DEFAULT_OBS_VERSION: "32.1.2"

jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 120

    defaults:
      run:
        shell: pwsh

    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      plugin_version: ${{ steps.metadata.outputs.plugin_version }}
      obs_version: ${{ steps.metadata.outputs.obs_version }}

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Resolve build metadata
        id: metadata
        env:
          OBS_VERSION_INPUT: ${{ inputs.obs_version }}
        run: |
          $ObsVersion = $env:OBS_VERSION_INPUT
          if ([string]::IsNullOrWhiteSpace($ObsVersion)) {
            $ObsVersion = $env:DEFAULT_OBS_VERSION
          }

          if ("${{ github.ref_type }}" -eq "tag") {
            $PluginVersion = "${{ github.ref_name }}" -replace '^v', ''
            $BuildConfig = "Release"
          } else {
            $ProjectVersion = Select-String `
              -Path CMakeLists.txt `
              -Pattern 'project\(obs-wmp-smtc VERSION ([0-9]+\.[0-9]+\.[0-9]+)' |
              ForEach-Object { $_.Matches[0].Groups[1].Value } |
              Select-Object -First 1
            if ([string]::IsNullOrWhiteSpace($ProjectVersion)) {
              $ProjectVersion = "0.0.0"
            }

            $ShortSha = "${{ github.sha }}".Substring(0, 9)
            $PluginVersion = "$ProjectVersion+$ShortSha"
            $BuildConfig = "RelWithDebInfo"
          }

          $ArtifactName = "$env:PLUGIN_NAME-$PluginVersion-windows-x64"

          "obs_version=$ObsVersion" >> $env:GITHUB_OUTPUT
          "plugin_version=$PluginVersion" >> $env:GITHUB_OUTPUT
          "build_config=$BuildConfig" >> $env:GITHUB_OUTPUT
          "artifact_name=$ArtifactName" >> $env:GITHUB_OUTPUT

      - name: Check out OBS Studio
        run: |
          $ObsDir = Join-Path $env:RUNNER_TEMP "obs-studio"
          git clone `
            --branch "${{ steps.metadata.outputs.obs_version }}" `
            --depth 1 `
            --recurse-submodules `
            --shallow-submodules `
            https://github.com/obsproject/obs-studio.git `
            $ObsDir
          "OBS_SOURCE_DIR=$ObsDir" >> $env:GITHUB_ENV

      - name: Configure OBS Studio libobs
        working-directory: ${{ runner.temp }}\obs-studio
        run: |
          cmake --preset windows-x64 `
            -DENABLE_BROWSER:BOOL=OFF `
            -DENABLE_WEBRTC:BOOL=OFF `
            -DENABLE_SCRIPTING:BOOL=OFF `
            -DENABLE_VLC:BOOL=OFF `
            -DENABLE_AJA:BOOL=OFF `
            -DENABLE_DECKLINK:BOOL=OFF `
            -DENABLE_VST:BOOL=OFF

      - name: Build libobs
        run: |
          cmake --build "$env:OBS_SOURCE_DIR\build_x64" `
            --config "${{ steps.metadata.outputs.build_config }}" `
            --target libobs `
            --parallel

      - name: Configure plugin
        run: |
          function ConvertTo-CMakePath {
            param([Parameter(Mandatory = $true)][string] $Path)
            return ([System.IO.Path]::GetFullPath($Path) -replace '\\', '/')
          }

          $ObsBuildDir = Join-Path $env:OBS_SOURCE_DIR "build_x64"
          $LibobsDir = Join-Path $ObsBuildDir "libobs"
          $W32PthreadsDir = Join-Path $ObsBuildDir "deps\w32-pthreads"
          $LibobsConfig = Join-Path $LibobsDir "libobsConfig.cmake"

          $ModulePaths = @(
            (Join-Path $PWD ".github\cmake"),
            (Join-Path $env:OBS_SOURCE_DIR "cmake\finders"),
            (Join-Path $LibobsDir "finders")
          ) | Where-Object { Test-Path -LiteralPath $_ }
          $ModulePaths = $ModulePaths |
            ForEach-Object { ConvertTo-CMakePath $_ } |
            Select-Object -Unique

          $PrefixPaths = @($LibobsDir, $W32PthreadsDir)
          $CachePath = Join-Path $ObsBuildDir "CMakeCache.txt"
          $CachePrefix = Select-String `
            -Path $CachePath `
            -Pattern '^CMAKE_PREFIX_PATH:.*=(.*)$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value } |
            Select-Object -First 1

          if (-not [string]::IsNullOrWhiteSpace($CachePrefix)) {
            $PrefixPaths += $CachePrefix -split ';'
          }

          $PackageDirArgs = [ordered]@{
            "libobs_DIR" = $LibobsDir
            "w32-pthreads_DIR" = $W32PthreadsDir
          }

          Select-String `
            -Path $CachePath `
            -Pattern '^([^#/:]+_DIR):PATH=(.*)$' |
            ForEach-Object {
              $Name = $_.Matches[0].Groups[1].Value
              $Value = $_.Matches[0].Groups[2].Value
              if (-not [string]::IsNullOrWhiteSpace($Value) -and
                  $Value -notmatch '-NOTFOUND$' -and
                  (Test-Path -LiteralPath $Value)) {
                $PackageDirArgs[$Name] = $Value
                $PrefixPaths += $Value
              }
            }

          $SearchRoots = @(
            $ObsBuildDir,
            (Join-Path $env:OBS_SOURCE_DIR ".deps"),
            (Join-Path $env:OBS_SOURCE_DIR "deps")
          ) | Where-Object { Test-Path -LiteralPath $_ }

          $ConfigFiles = @()
          foreach ($Root in $SearchRoots) {
            $ConfigFiles += Get-ChildItem -LiteralPath $Root -Recurse -File |
              Where-Object {
                $_.Name -like "*Config.cmake" -or
                $_.Name -like "*-config.cmake"
              }
          }

          $FindModules = @()
          foreach ($ModulePath in $ModulePaths) {
            $FindModules += Get-ChildItem -LiteralPath $ModulePath -File -Filter "Find*.cmake"
          }

          $SimdeHeader = $null
          $SimdeSearchRoots = @(
            (Join-Path $env:OBS_SOURCE_DIR ".deps"),
            (Join-Path $env:OBS_SOURCE_DIR "libobs\util"),
            (Join-Path $env:OBS_SOURCE_DIR "deps"),
            $ObsBuildDir
          ) | Where-Object { Test-Path -LiteralPath $_ }

          foreach ($Root in $SimdeSearchRoots) {
            $SimdeHeader = Get-ChildItem `
              -LiteralPath $Root `
              -Recurse `
              -File `
              -Filter "simde-features.h" |
              Where-Object { $_.Directory.Name -ieq "simde" } |
              Select-Object -First 1

            if ($SimdeHeader -ne $null) {
              break
            }
          }

          if ($SimdeHeader -ne $null) {
            $SimdeIncludeDir = $SimdeHeader.Directory.Parent.FullName
            $PackageDirArgs["SIMDe_INCLUDE_DIR"] = $SimdeIncludeDir
            $PrefixPaths += $SimdeIncludeDir
          }

          $Dependencies = Select-String `
            -Path $LibobsConfig `
            -Pattern '^\s*find_dependency\(([^\s\)]+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value } |
            Where-Object { $_ -ne "Threads" } |
            Select-Object -Unique

          foreach ($Dependency in $Dependencies) {
            $ArgName = "${Dependency}_DIR"
            if ($PackageDirArgs.Contains($ArgName)) {
              continue
            }

            $Config = $ConfigFiles |
              Where-Object {
                $_.Name -ieq "${Dependency}Config.cmake" -or
                $_.Name -ieq "${Dependency}-config.cmake"
              } |
              Select-Object -First 1

            if ($Config -eq $null) {
              $Module = $FindModules |
                Where-Object { $_.Name -ieq "Find${Dependency}.cmake" } |
                Select-Object -First 1

              if ($Module -ne $null) {
                Write-Host "Using finder module for OBS dependency '$Dependency': $($Module.FullName)"
                continue
              }

              throw "Unable to locate CMake package config or finder module for OBS dependency '$Dependency'."
            }

            $PackageDirArgs[$ArgName] = $Config.DirectoryName
            $PrefixPaths += $Config.DirectoryName
          }

          $PrefixPaths = $PrefixPaths |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            ForEach-Object { ConvertTo-CMakePath $_ } |
            Select-Object -Unique

          $NormalizedPackageDirArgs = [ordered]@{}
          $PackageDirArgs.GetEnumerator() | ForEach-Object {
            $Name = $_.Key
            $Value = $_.Value
            if (-not [string]::IsNullOrWhiteSpace($Value)) {
              $Value = ConvertTo-CMakePath $Value
            }
            $NormalizedPackageDirArgs[$Name] = $Value
          }
          $PackageDirArgs = $NormalizedPackageDirArgs

          Write-Host "Plugin CMAKE_PREFIX_PATH:"
          $PrefixPaths | ForEach-Object { Write-Host "  $_" }

          Write-Host "Plugin CMAKE_MODULE_PATH:"
          $ModulePaths | ForEach-Object { Write-Host "  $_" }

          Write-Host "Resolved OBS CMake variables:"
          $PackageDirArgs.GetEnumerator() | ForEach-Object {
            Write-Host "  $($_.Key)=$($_.Value)"
          }

          $CmakeArgs = @(
            "-S", ".",
            "-B", "build",
            "-G", "Visual Studio 17 2022",
            "-A", "x64",
            "-DCMAKE_PREFIX_PATH=$($PrefixPaths -join ';')",
            "-DCMAKE_MODULE_PATH=$($ModulePaths -join ';')"
          )

          $PackageDirArgs.GetEnumerator() | ForEach-Object {
            $CmakeArgs += "-D$($_.Key)=$($_.Value)"
          }

          cmake @CmakeArgs

      - name: Build plugin
        run: |
          cmake --build build `
            --config "${{ steps.metadata.outputs.build_config }}" `
            --parallel

      - name: Install plugin layout
        run: |
          $InstallRoot = Join-Path $PWD "package\${{ steps.metadata.outputs.artifact_name }}"
          cmake --install build `
            --config "${{ steps.metadata.outputs.build_config }}" `
            --prefix "$InstallRoot"
          "INSTALL_ROOT=$InstallRoot" >> $env:GITHUB_ENV

      - name: Copy overlay and installer into package
        run: |
          $OverlayDst = Join-Path $env:INSTALL_ROOT "data\obs-plugins\$env:PLUGIN_NAME\overlay"
          New-Item -ItemType Directory -Path $OverlayDst -Force | Out-Null
          Copy-Item -Path "overlay\*" -Destination $OverlayDst -Recurse -Force
          Copy-Item -Path "install.ps1" -Destination $env:INSTALL_ROOT -Force

      - name: Package plugin
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null

          $PackageZip = Join-Path $PWD "release\${{ steps.metadata.outputs.artifact_name }}.zip"
          Compress-Archive `
            -Path "$env:INSTALL_ROOT\*" `
            -DestinationPath $PackageZip `
            -Force

          $Pdb = Get-ChildItem -Path build -Recurse -Filter "$env:PLUGIN_NAME.pdb" |
            Select-Object -First 1
          if ($Pdb -ne $null) {
            $SymbolsRoot = Join-Path $PWD "package\${{ steps.metadata.outputs.artifact_name }}-symbols"
            New-Item -ItemType Directory -Path $SymbolsRoot -Force | Out-Null
            Copy-Item -LiteralPath $Pdb.FullName -Destination $SymbolsRoot

            $SymbolsZip = Join-Path $PWD "release\${{ steps.metadata.outputs.artifact_name }}-symbols.zip"
            Compress-Archive `
              -Path "$SymbolsRoot\*" `
              -DestinationPath $SymbolsZip `
              -Force
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: release/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: windows
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows.outputs.artifact_name }}
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          shopt -s globstar nullglob
          files=(artifacts/**/*.zip)

          if ((${#files[@]} == 0)); then
            echo "No release artifacts found." >&2
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${files[@]}" --clobber
            exit 0
          fi

          args=(
            release create "$TAG_NAME"
            "${files[@]}"
            --title "$TAG_NAME"
            --generate-notes
          )

          if [[ "$TAG_NAME" =~ (alpha|beta|rc) ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
