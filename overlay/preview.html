<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMP Now Playing Preview</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #161b20;
    }

    .preview-controls {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      gap: 8px;
    }

    .preview-btn {
      padding: 7px 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(13, 17, 20, 0.88);
      color: #f4f7f8;
      font: 700 12px "Segoe UI", Arial, sans-serif;
      cursor: pointer;
    }

    .preview-btn:hover {
      border-color: rgba(110, 231, 200, 0.55);
    }
  </style>
</head>
<body>
  <div class="preview-controls">
    <button class="preview-btn" onclick="setMode('Playing')">Playing</button>
    <button class="preview-btn" onclick="setMode('Paused')">Paused</button>
    <button class="preview-btn" onclick="nextTrack()">Next</button>
    <button class="preview-btn" onclick="setWaiting()">Waiting</button>
  </div>

  <main id="card" class="now-card playing" aria-live="polite">
    <div class="accent-line"></div>
    <section class="mark-panel">
      <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M18 33V12l18-4v21" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="14" cy="34" r="6" fill="none" stroke="currentColor" stroke-width="3"/>
        <circle cx="32" cy="30" r="6" fill="none" stroke="currentColor" stroke-width="3"/>
      </svg>
      <div class="meter" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
    </section>

    <section class="content">
      <div class="status-row">
        <span class="status-dot"></span>
        <span id="status-text" class="status-text">Playing</span>
        <span id="backend" class="backend">WMP Legacy COM</span>
      </div>
      <div class="title-wrap">
        <div id="title" class="title"></div>
      </div>
      <div id="artist" class="artist"></div>
      <div id="album" class="album"></div>
      <div class="progress-block">
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div class="time-row">
          <span id="time-current">1:18</span>
          <span id="time-duration">4:32</span>
        </div>
      </div>
      <div id="queue" class="queue">
        <div class="queue-head">
          <span>Queue</span>
          <span>4 tracks</span>
        </div>
        <ol id="queue-list"></ol>
      </div>
    </section>
  </main>

  <script>
    const tracks = [
      { title: 'Nocturne Op. 9 No. 2', artist: 'Frederic Chopin', album: 'Nocturnes', duration: '4:32' },
      { title: 'Clair de Lune', artist: 'Claude Debussy', album: 'Suite bergamasque', duration: '5:08' },
      { title: 'Moonlight Sonata', artist: 'Ludwig van Beethoven', album: 'Piano Sonatas', duration: '6:15' },
      { title: 'The Four Seasons - Spring', artist: 'Antonio Vivaldi', album: 'Le quattro stagioni', duration: '3:24' },
    ];

    let current = 0;
    let progress = 0.28;
    let playing = true;

    const card = document.getElementById('card');
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');
    const album = document.getElementById('album');
    const statusText = document.getElementById('status-text');
    const progressFill = document.getElementById('progress-fill');
    const timeCurrent = document.getElementById('time-current');
    const timeDuration = document.getElementById('time-duration');
    const queueList = document.getElementById('queue-list');

    function renderTrack() {
      const track = tracks[current];
      title.textContent = track.title;
      artist.textContent = track.artist;
      album.textContent = track.album;
      timeDuration.textContent = track.duration;
      progressFill.style.width = `${(progress * 100).toFixed(2)}%`;
      queueList.replaceChildren(...tracks.map((item, index) => {
        const li = document.createElement('li');
        if (index === current) li.className = 'current';
        li.textContent = `${index + 1}. ${item.title} - ${item.artist}`;
        return li;
      }));
    }

    function setMode(mode) {
      playing = mode === 'Playing';
      card.classList.toggle('playing', playing);
      card.classList.toggle('paused', mode === 'Paused');
      card.classList.remove('waiting');
      statusText.textContent = mode;
      renderTrack();
    }

    function nextTrack() {
      current = (current + 1) % tracks.length;
      progress = 0;
      card.classList.remove('track-change');
      void card.offsetWidth;
      card.classList.add('track-change');
      renderTrack();
    }

    function setWaiting() {
      playing = false;
      card.classList.remove('playing', 'paused');
      card.classList.add('waiting');
      statusText.textContent = 'Waiting';
      title.textContent = 'Waiting for Windows Media Player';
      artist.textContent = 'No now-playing data yet.';
      album.textContent = '';
      progressFill.style.width = '0%';
      timeCurrent.textContent = '--:--';
      timeDuration.textContent = '--:--';
      queueList.replaceChildren();
    }

    function formatTime(ms) {
      const total = Math.floor(ms / 1000);
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;
      return `${minutes}:${String(seconds).padStart(2, '0')}`;
    }

    setInterval(() => {
      if (!playing) return;
      progress = Math.min(progress + 0.0018, 1);
      progressFill.style.width = `${(progress * 100).toFixed(2)}%`;
      timeCurrent.textContent = formatTime(progress * 272000);
      if (progress >= 1) nextTrack();
    }, 50);

    renderTrack();
  </script>
</body>
</html>
