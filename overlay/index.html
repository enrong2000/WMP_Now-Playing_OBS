<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMP Now Playing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="card" class="now-card waiting" aria-live="polite">
    <div class="accent-line"></div>
    <section class="mark-panel">
      <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M18 33V12l18-4v21" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="14" cy="34" r="6" fill="none" stroke="currentColor" stroke-width="3"/>
        <circle cx="32" cy="30" r="6" fill="none" stroke="currentColor" stroke-width="3"/>
      </svg>
      <div id="meter" class="meter" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
    </section>

    <section class="content">
      <div class="status-row">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text" class="status-text">Waiting</span>
        <span id="backend" class="backend">WMP Legacy</span>
      </div>

      <div class="title-wrap">
        <div id="title" class="title">Waiting for Windows Media Player</div>
      </div>
      <div id="artist" class="artist">Start playback in Windows Media Player Legacy.</div>
      <div id="album" class="album"></div>

      <div class="progress-block">
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div class="time-row">
          <span id="time-current">--:--</span>
          <span id="time-duration">--:--</span>
        </div>
      </div>

      <div id="queue" class="queue hidden">
        <div class="queue-head">
          <span>Queue</span>
          <span id="queue-count">0 tracks</span>
        </div>
        <ol id="queue-list"></ol>
      </div>
    </section>
  </main>

  <script>
    const CONFIG = {
      pollIntervalMs: 500,
      idleAfterMs: 4500,
      defaultJsonPath: '',
    };

    const state = {
      jsonUrl: '',
      currentData: null,
      lastPollTime: 0,
      lastPosition: 0,
      lastDuration: 0,
      lastStatus: '',
      lastTrackKey: '',
      idleTimer: null,
    };

    const els = {
      card: document.getElementById('card'),
      title: document.getElementById('title'),
      artist: document.getElementById('artist'),
      album: document.getElementById('album'),
      backend: document.getElementById('backend'),
      statusText: document.getElementById('status-text'),
      progressFill: document.getElementById('progress-fill'),
      timeCurrent: document.getElementById('time-current'),
      timeDuration: document.getElementById('time-duration'),
      queue: document.getElementById('queue'),
      queueList: document.getElementById('queue-list'),
      queueCount: document.getElementById('queue-count'),
    };

    function isObsAbsoluteOrigin() {
      return window.location.protocol === 'http:' &&
        window.location.hostname === 'absolute';
    }

    function encodeAbsolutePath(path) {
      const clean = path
        .replace(/^file:\/\/\/?/i, '')
        .replace(/\\/g, '/')
        .replace(/^\/+([A-Za-z]:)/, '$1');

      return clean.split('/').map((part, index) => {
        if (index === 0 && /^[A-Za-z]:$/.test(part)) return part;
        return encodeURIComponent(part);
      }).join('/');
    }

    function toBrowserUrl(value) {
      if (!value) return '';
      if (/^https?:\/\//i.test(value)) return value;
      if (isObsAbsoluteOrigin()) {
        return 'http://absolute/' + encodeAbsolutePath(value);
      }
      if (/^file:\/\//i.test(value)) return value;
      return 'file:///' + encodeAbsolutePath(value);
    }

    function withCacheBust(url) {
      const glue = url.includes('?') ? '&' : '?';
      return `${url}${glue}t=${Date.now()}`;
    }

    async function loadOverlayConfig() {
      const params = new URLSearchParams(window.location.search);
      const jsonParam = params.get('json');
      if (jsonParam) return toBrowserUrl(jsonParam);

      try {
        const response = await fetch(withCacheBust('config.json'), {
          cache: 'no-store',
        });
        if (response.ok) {
          const config = await response.json();
          return toBrowserUrl(config.jsonUrl || config.jsonPath || '');
        }
      } catch (error) {}

      const appdata = params.get('appdata');
      if (appdata) {
        return toBrowserUrl(`${appdata.replace(/\\/g, '/')}/obs-wmp-legacy/now-playing.json`);
      }

      return toBrowserUrl(CONFIG.defaultJsonPath);
    }

    async function fetchData() {
      if (!state.jsonUrl) return null;
      try {
        const response = await fetch(withCacheBust(state.jsonUrl), {
          cache: 'no-store',
        });
        if (!response.ok) return null;
        return await response.json();
      } catch (error) {
        return null;
      }
    }

    function setWaiting(message) {
      els.card.classList.remove('playing', 'paused');
      els.card.classList.add('waiting');
      els.statusText.textContent = 'Waiting';
      els.backend.textContent = 'WMP Legacy';
      els.title.textContent = 'Waiting for Windows Media Player';
      els.artist.textContent = message || 'No now-playing data yet.';
      els.album.textContent = '';
      els.progressFill.style.width = '0%';
      els.timeCurrent.textContent = '--:--';
      els.timeDuration.textContent = '--:--';
      els.queue.classList.add('hidden');
    }

    function formatTime(ms) {
      const safeMs = Math.max(0, ms || 0);
      const total = Math.floor(safeMs / 1000);
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = total % 60;
      if (hours > 0) {
        return `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }
      return `${minutes}:${String(seconds).padStart(2, '0')}`;
    }

    function updateQueue(data) {
      const items = Array.isArray(data.playlist) ? data.playlist : [];
      if (!items.length) {
        els.queue.classList.add('hidden');
        els.queueList.replaceChildren();
        return;
      }

      els.queue.classList.remove('hidden');
      els.queueCount.textContent = `${items.length} ${items.length === 1 ? 'track' : 'tracks'}`;

      const currentIndex = Number.isInteger(data.current_playlist_index)
        ? data.current_playlist_index
        : -1;
      const windowed = items
        .filter((item) => {
          if (currentIndex < 0) return item.index < 4;
          return item.index >= currentIndex - 1 && item.index <= currentIndex + 3;
        })
        .slice(0, 5);

      els.queueList.replaceChildren(...windowed.map((item) => {
        const li = document.createElement('li');
        if (item.index === currentIndex) li.className = 'current';
        const title = item.title || 'Unknown title';
        const artist = item.artist ? ` - ${item.artist}` : '';
        li.textContent = `${item.index + 1}. ${title}${artist}`;
        return li;
      }));
    }

    function updateUI(data) {
      if (!data || !data.available) {
        const reason = data && data.diagnostic ? data.diagnostic : 'JSON data is not reachable yet.';
        setWaiting(reason);
        return;
      }

      const key = `${data.title || ''}|${data.artist || ''}|${data.album || ''}`;
      if (key !== state.lastTrackKey) {
        els.card.classList.remove('track-change');
        void els.card.offsetWidth;
        els.card.classList.add('track-change');
        state.lastTrackKey = key;
      }

      const status = data.status || 'Unknown';
      const isPlaying = status === 'Playing';
      const isPaused = status === 'Paused';

      els.card.classList.toggle('playing', isPlaying);
      els.card.classList.toggle('paused', isPaused);
      els.card.classList.remove('waiting');
      els.statusText.textContent = status;
      els.backend.textContent = data.backend || data.source_app_id || 'WMP Legacy';

      els.title.textContent = data.title || 'Unknown title';
      els.artist.textContent = data.artist || 'Unknown artist';
      els.album.textContent = data.album || '';
      els.album.classList.toggle('hidden', !data.album);

      const progress = Math.max(0, Math.min(1, Number(data.progress) || 0));
      els.progressFill.style.width = `${(progress * 100).toFixed(2)}%`;
      els.timeCurrent.textContent = data.position_text || formatTime(data.position_ms);
      els.timeDuration.textContent = data.duration_text || formatTime(data.duration_ms);

      updateQueue(data);
    }

    function interpolateProgress() {
      if (!state.currentData || state.lastStatus !== 'Playing') return;
      if (state.lastDuration <= 0) return;

      const elapsed = Date.now() - state.lastPollTime;
      const position = Math.min(state.lastPosition + elapsed, state.lastDuration);
      const ratio = position / state.lastDuration;
      els.progressFill.style.width = `${(ratio * 100).toFixed(2)}%`;
      els.timeCurrent.textContent = formatTime(position);
    }

    async function poll() {
      const data = await fetchData();
      if (!data) {
        if (!state.idleTimer) {
          state.idleTimer = setTimeout(() => {
            setWaiting('Waiting for now-playing JSON.');
            state.idleTimer = null;
          }, CONFIG.idleAfterMs);
        }
        return;
      }

      if (state.idleTimer) {
        clearTimeout(state.idleTimer);
        state.idleTimer = null;
      }

      state.currentData = data;
      state.lastPollTime = Date.now();
      state.lastPosition = Number(data.position_ms) || 0;
      state.lastDuration = Number(data.duration_ms) || 0;
      state.lastStatus = data.status || '';
      updateUI(data);
    }

    async function boot() {
      state.jsonUrl = await loadOverlayConfig();
      await poll();
      setInterval(poll, CONFIG.pollIntervalMs);
      setInterval(interpolateProgress, 33);
    }

    boot();
  </script>
</body>
</html>
