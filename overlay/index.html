<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMP Now Playing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="card" class="player-window mode-minimized waiting" aria-live="polite">
    <header class="window-bar">
      <h1>MUSIC PLAYER</h1>
      <div class="window-actions" aria-hidden="true">
        <span id="mode-action" class="window-icon plus"></span>
        <span class="window-divider"></span>
        <span class="window-icon close"></span>
      </div>
    </header>

    <section class="now-panel">
      <div class="panel-surface">
        <div class="panel-top">
          <div class="now-pill">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 18V5l10-2v13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="6.5" cy="18" r="3.2" fill="currentColor"/>
              <circle cx="16.5" cy="16" r="3.2" fill="currentColor"/>
            </svg>
            <span>NOW PLAYING</span>
          </div>
          <div class="sound-mark" aria-hidden="true">
            <svg class="speaker" viewBox="0 0 24 24">
              <path d="M4 10v4h4l5 4V6l-5 4H4z" fill="currentColor"/>
              <path d="M16 9c1.2 1.7 1.2 4.3 0 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <div class="bars">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>

        <div class="track-grid">
          <div class="note-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <path d="M25 46V15l25-5v31" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="17" cy="47" r="8" fill="currentColor"/>
              <circle cx="43" cy="42" r="8" fill="currentColor"/>
            </svg>
          </div>

          <div class="track-copy">
            <div id="title" class="track-title">Waiting for Windows Media Player</div>
            <div id="artist" class="track-artist">Start playback in Windows Media Player Legacy.</div>
            <div class="compact-time">
              <span id="compact-current">--:--</span>
              <span>/</span>
              <span id="compact-duration">--:--</span>
            </div>
          </div>

          <div class="meta-grid">
            <div class="meta-item composer-item">
              <div class="meta-label">Composer</div>
              <div id="composer" class="meta-value">--</div>
            </div>
            <div class="meta-separator"></div>
            <div class="meta-item album-item">
              <div class="meta-label">Album</div>
              <div id="album" class="meta-value">--</div>
            </div>
          </div>
        </div>

        <div class="progress-block">
          <div class="progress-track">
            <div id="progress-fill" class="progress-fill"></div>
            <div id="progress-thumb" class="progress-thumb"></div>
          </div>
          <div class="time-row">
            <span id="time-current">--:--</span>
            <span id="time-duration">--:--</span>
          </div>
        </div>
      </div>
    </section>

    <section id="playlist-panel" class="playlist-panel hidden">
      <div class="playlist-head">
        <span>CURRENT PLAYLIST</span>
        <span id="playlist-count">0 tracks</span>
      </div>

      <ol id="compact-list" class="compact-list"></ol>

      <div class="expanded-list">
        <article id="previous-card" class="song-card hidden">
          <div class="song-label">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 9 12l9 6V6zM6 6h2v12H6z" fill="currentColor"/>
            </svg>
            <span>PREVIOUS</span>
          </div>
          <div class="song-row">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 18V5l10-2v13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="6.5" cy="18" r="3.2" fill="currentColor"/>
              <circle cx="16.5" cy="16" r="3.2" fill="currentColor"/>
            </svg>
            <div>
              <div id="previous-title" class="song-title"></div>
              <div id="previous-artist" class="song-artist"></div>
            </div>
          </div>
        </article>

        <section id="next-card" class="song-card hidden">
          <div class="song-label">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 6 9 6-9 6V6zM16 6h2v12h-2z" fill="currentColor"/>
            </svg>
            <span>NEXT</span>
          </div>
          <ol id="next-list" class="next-list"></ol>
        </section>
      </div>
    </section>

    <footer id="status-footer" class="status-footer">
      <span class="info-dot" aria-hidden="true">i</span>
      <span id="footer-text">Playing from your selected music source.</span>
    </footer>
  </main>

  <script>
    const DEFAULTS = {
      mode: 'minimized',
      upcomingTracks: 3,
      compactRevealMs: 3000,
      maximizedQueueMode: 'single',
      pollIntervalMs: 200,
      idleAfterMs: 4500,
    };

    const state = {
      jsonUrl: '',
      mode: DEFAULTS.mode,
      upcomingTracks: DEFAULTS.upcomingTracks,
      compactRevealMs: DEFAULTS.compactRevealMs,
      maximizedQueueMode: DEFAULTS.maximizedQueueMode,
      currentData: null,
      lastPollTime: 0,
      lastPosition: 0,
      lastDuration: 0,
      lastStatus: '',
      lastTrackKey: '',
      idleTimer: null,
      revealTimer: null,
      revealDeadline: 0,
    };

    const els = {
      card: document.getElementById('card'),
      modeAction: document.getElementById('mode-action'),
      title: document.getElementById('title'),
      artist: document.getElementById('artist'),
      composer: document.getElementById('composer'),
      album: document.getElementById('album'),
      progressFill: document.getElementById('progress-fill'),
      progressThumb: document.getElementById('progress-thumb'),
      timeCurrent: document.getElementById('time-current'),
      timeDuration: document.getElementById('time-duration'),
      compactCurrent: document.getElementById('compact-current'),
      compactDuration: document.getElementById('compact-duration'),
      playlistPanel: document.getElementById('playlist-panel'),
      playlistCount: document.getElementById('playlist-count'),
      compactList: document.getElementById('compact-list'),
      previousCard: document.getElementById('previous-card'),
      previousTitle: document.getElementById('previous-title'),
      previousArtist: document.getElementById('previous-artist'),
      nextCard: document.getElementById('next-card'),
      nextList: document.getElementById('next-list'),
      footerText: document.getElementById('footer-text'),
    };

    function isObsAbsoluteOrigin() {
      return window.location.protocol === 'http:' &&
        window.location.hostname === 'absolute';
    }

    function encodeAbsolutePath(path) {
      const clean = path
        .replace(/^file:\/\/\/?/i, '')
        .replace(/\\/g, '/')
        .replace(/^\/+([A-Za-z]:)/, '$1');

      return clean.split('/').map((part, index) => {
        if (index === 0 && /^[A-Za-z]:$/.test(part)) return part;
        return encodeURIComponent(part);
      }).join('/');
    }

    function toBrowserUrl(value) {
      if (!value) return '';
      if (/^https?:\/\//i.test(value)) return value;
      if (isObsAbsoluteOrigin()) {
        return 'http://absolute/' + encodeAbsolutePath(value);
      }
      if (/^file:\/\//i.test(value)) return value;
      return 'file:///' + encodeAbsolutePath(value);
    }

    function withCacheBust(url) {
      const glue = url.includes('?') ? '&' : '?';
      return `${url}${glue}t=${Date.now()}`;
    }

    function clampNumber(value, min, max, fallback) {
      const number = Number(value);
      if (!Number.isFinite(number)) return fallback;
      return Math.max(min, Math.min(max, Math.round(number)));
    }

    function normalizeMode(value) {
      return String(value || '').toLowerCase() === 'maximized'
        ? 'maximized'
        : 'minimized';
    }

    function normalizeMaximizedQueueMode(value, fallback = DEFAULTS.maximizedQueueMode) {
      const normalized = String(value || '').toLowerCase();
      if (normalized === 'multiple') return 'multiple';
      if (normalized === 'single') return 'single';
      return fallback;
    }

    function applyOverlaySettings(settings) {
      state.mode = normalizeMode(settings.mode || state.mode);
      state.upcomingTracks = clampNumber(
        settings.upcomingTracks,
        0,
        10,
        DEFAULTS.upcomingTracks
      );
      state.compactRevealMs = clampNumber(
        settings.compactRevealMs,
        0,
        10000,
        DEFAULTS.compactRevealMs
      );
      state.maximizedQueueMode = normalizeMaximizedQueueMode(
        settings.maximizedQueueMode || state.maximizedQueueMode
      );

      els.card.classList.toggle('mode-maximized', state.mode === 'maximized');
      els.card.classList.toggle('mode-minimized', state.mode !== 'maximized');
      els.card.classList.toggle('queue-single', state.maximizedQueueMode === 'single');
      els.card.classList.toggle('queue-multiple', state.maximizedQueueMode !== 'single');
      els.modeAction.classList.toggle('minus', state.mode === 'maximized');
      els.modeAction.classList.toggle('plus', state.mode !== 'maximized');
    }

    async function probeJsonUrl(candidatePath) {
      const url = toBrowserUrl(candidatePath);
      if (!url) return '';
      try {
        const response = await fetch(withCacheBust(url), { cache: 'no-store' });
        if (!response.ok) return '';
        const data = await response.json();
        if (typeof data === 'object' && 'available' in data) return url;
      } catch (error) {}
      return '';
    }

    async function discoverJsonInObs() {
      if (!isObsAbsoluteOrigin()) return '';

      const pathMatch = window.location.pathname.match(/^\/([A-Za-z]:)\//);
      const drive = pathMatch ? pathMatch[1] : 'C:';
      const jsonRelPath = 'AppData/Roaming/obs-wmp-legacy/now-playing.json';
      const pluginCfgRel = 'AppData/Roaming/obs-studio/plugin_config/obs-wmp-legacy/overlay-config.json';

      const cached = localStorage.getItem('obs_wmp_json_url');
      if (cached) {
        const ok = await probeJsonUrl(cached);
        if (ok) return ok;
        localStorage.removeItem('obs_wmp_json_url');
      }

      const candidates = new Set();
      try {
        const loc = decodeURIComponent(window.location.pathname);
        const match = loc.match(/\/([A-Za-z]:)\/Users\/([^/]+)\//i);
        if (match) candidates.add(match[2]);
      } catch (error) {}
      try {
        if (document.referrer) {
          const match = decodeURIComponent(document.referrer).match(
            /\/([A-Za-z]:)\/Users\/([^/]+)\//i
          );
          if (match) candidates.add(match[2]);
        }
      } catch (error) {}

      const drives = new Set([drive]);
      ['C:', 'D:', 'E:', 'F:'].forEach((item) => drives.add(item));

      for (const name of candidates) {
        for (const itemDrive of drives) {
          const path = `${itemDrive}/Users/${name}/${jsonRelPath}`;
          const url = await probeJsonUrl(path);
          if (url) {
            localStorage.setItem('obs_wmp_json_url', path);
            return url;
          }
        }
      }

      for (const name of candidates) {
        for (const itemDrive of drives) {
          const cfgPath = `${itemDrive}/Users/${name}/${pluginCfgRel}`;
          const cfgUrl = toBrowserUrl(cfgPath);
          if (!cfgUrl) continue;
          try {
            const response = await fetch(withCacheBust(cfgUrl), { cache: 'no-store' });
            if (!response.ok) continue;
            const config = await response.json();
            const jsonPath = config.jsonUrl || config.jsonPath || '';
            if (jsonPath) {
              localStorage.setItem('obs_wmp_json_url', jsonPath);
              return toBrowserUrl(jsonPath);
            }
          } catch (error) {}
        }
      }

      const nonStandardBases = ['Documents and Settings', 'UserData', 'Profile'];
      for (const itemDrive of drives) {
        for (const base of nonStandardBases) {
          const directPath = `${itemDrive}/${base}/${jsonRelPath}`;
          const directUrl = await probeJsonUrl(directPath);
          if (directUrl) {
            localStorage.setItem('obs_wmp_json_url', directPath);
            return directUrl;
          }

          const cfgPath = `${itemDrive}/${base}/${pluginCfgRel}`;
          const cfgUrl = toBrowserUrl(cfgPath);
          if (!cfgUrl) continue;
          try {
            const response = await fetch(withCacheBust(cfgUrl), { cache: 'no-store' });
            if (!response.ok) continue;
            const config = await response.json();
            const jsonPath = config.jsonUrl || config.jsonPath || '';
            if (jsonPath) {
              localStorage.setItem('obs_wmp_json_url', jsonPath);
              return toBrowserUrl(jsonPath);
            }
          } catch (error) {}
        }
      }

      return '';
    }

    async function loadOverlayConfig() {
      const params = new URLSearchParams(window.location.search);
      const settings = {
        jsonUrl: '',
        mode: DEFAULTS.mode,
        upcomingTracks: DEFAULTS.upcomingTracks,
        compactRevealMs: DEFAULTS.compactRevealMs,
        maximizedQueueMode: DEFAULTS.maximizedQueueMode,
      };

      try {
        const response = await fetch(withCacheBust('config.json'), { cache: 'no-store' });
        if (response.ok) {
          const config = await response.json();
          const jsonPath = config.jsonUrl || config.jsonPath || '';
          settings.jsonUrl = toBrowserUrl(jsonPath);
          settings.mode = normalizeMode(config.mode);
          settings.upcomingTracks = clampNumber(
            config.upcomingTracks,
            0,
            10,
            settings.upcomingTracks
          );
          settings.compactRevealMs = clampNumber(
            config.compactRevealMs,
            0,
            10000,
            settings.compactRevealMs
          );
          settings.maximizedQueueMode = normalizeMaximizedQueueMode(
            config.maximizedQueueMode || config.maximized_queue,
            settings.maximizedQueueMode
          );
        }
      } catch (error) {}

      const appdata = params.get('appdata');
      if (!settings.jsonUrl && appdata) {
        settings.jsonUrl = toBrowserUrl(
          `${appdata.replace(/\\/g, '/')}/obs-wmp-legacy/now-playing.json`
        );
      }

      const jsonParam = params.get('json');
      if (jsonParam) settings.jsonUrl = toBrowserUrl(jsonParam);

      if (params.has('mode')) settings.mode = normalizeMode(params.get('mode'));
      if (params.has('upcoming')) {
        settings.upcomingTracks = clampNumber(
          params.get('upcoming'),
          0,
          10,
          settings.upcomingTracks
        );
      }
      if (params.has('reveal_ms')) {
        settings.compactRevealMs = clampNumber(
          params.get('reveal_ms'),
          0,
          10000,
          settings.compactRevealMs
        );
      }
      if (params.has('maximized_queue')) {
        settings.maximizedQueueMode = normalizeMaximizedQueueMode(
          params.get('maximized_queue')
        );
      }

      if (!settings.jsonUrl) {
        settings.jsonUrl = await discoverJsonInObs();
      }

      return settings;
    }

    async function fetchData() {
      if (!state.jsonUrl) return null;
      try {
        const response = await fetch(withCacheBust(state.jsonUrl), {
          cache: 'no-store',
        });
        if (!response.ok) return null;
        return await response.json();
      } catch (error) {
        return null;
      }
    }

    function formatTime(ms) {
      const safeMs = Math.max(0, ms || 0);
      const total = Math.floor(safeMs / 1000);
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = total % 60;
      if (hours > 0) {
        return `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }
      return `${minutes}:${String(seconds).padStart(2, '0')}`;
    }

    function formatTrackTime(item) {
      const seconds = Number(item.duration_sec);
      if (!Number.isFinite(seconds) || seconds <= 0) return '';
      return formatTime(seconds * 1000);
    }

    function currentIndexFromData(data) {
      return Number.isInteger(data.current_playlist_index)
        ? data.current_playlist_index
        : -1;
    }

    function playlistPosition(items, currentIndex) {
      if (currentIndex >= 0) {
        const byIndex = items.findIndex((item) => item.index === currentIndex);
        if (byIndex >= 0) return byIndex;
      }
      return items.findIndex((item) =>
        (item.title || '') === (state.currentData?.title || '') &&
        (item.artist || '') === (state.currentData?.artist || '')
      );
    }

    function setWaiting(message) {
      clearTimeout(state.revealTimer);
      state.revealTimer = null;
      state.revealDeadline = 0;
      els.card.classList.remove('playing', 'paused', 'playlist-reveal');
      els.card.classList.add('waiting');
      els.title.textContent = 'Waiting for Windows Media Player';
      els.artist.textContent = message || 'No now-playing data yet.';
      els.composer.textContent = '--';
      els.album.textContent = '--';
      updateProgress(0, '--:--', '--:--');
      els.playlistPanel.classList.add('hidden');
      els.compactList.replaceChildren();
      els.nextList.replaceChildren();
      els.previousCard.classList.add('hidden');
      els.nextCard.classList.add('hidden');
      els.footerText.textContent = 'Waiting for your selected music source.';
    }

    function updateProgress(progress, currentText, durationText) {
      const safeProgress = Math.max(0, Math.min(1, Number(progress) || 0));
      const percent = `${(safeProgress * 100).toFixed(2)}%`;
      els.progressFill.style.width = percent;
      els.progressThumb.style.left = percent;
      els.timeCurrent.textContent = currentText;
      els.timeDuration.textContent = durationText;
      els.compactCurrent.textContent = currentText;
      els.compactDuration.textContent = durationText;
    }

    function triggerCompactReveal() {
      if (state.mode !== 'minimized' || state.compactRevealMs <= 0) return;

      state.revealDeadline = Date.now() + state.compactRevealMs;
      els.card.classList.add('playlist-reveal');
      scheduleCompactRevealClose();
    }

    function scheduleCompactRevealClose() {
      clearTimeout(state.revealTimer);
      const remaining = state.revealDeadline - Date.now();

      if (remaining <= 0) {
        els.card.classList.remove('playlist-reveal');
        state.revealTimer = null;
        state.revealDeadline = 0;
        return;
      }

      state.revealTimer = setTimeout(() => {
        if (Date.now() < state.revealDeadline - 16) {
          scheduleCompactRevealClose();
          return;
        }
        els.card.classList.remove('playlist-reveal');
        state.revealTimer = null;
        state.revealDeadline = 0;
      }, remaining);
    }

    function buildCompactItems(items, position) {
      if (!items.length) return [];
      if (position < 0) return items.slice(0, state.upcomingTracks + 1);

      const start = Math.max(0, position - 1);
      const end = Math.min(items.length, position + state.upcomingTracks + 1);
      return items.slice(start, end);
    }

    function renderCompactList(items, currentIndex, position) {
      const compactItems = buildCompactItems(items, position);
      els.compactList.replaceChildren(...compactItems.map((item) => {
        const li = document.createElement('li');
        if (item.index === currentIndex) li.className = 'current';

        const number = document.createElement('span');
        number.className = 'track-number';
        number.textContent = `${item.index + 1}`;

        const copy = document.createElement('span');
        copy.className = 'compact-copy';
        copy.textContent = item.title || 'Unknown title';

        const artist = document.createElement('span');
        artist.className = 'compact-artist';
        artist.textContent = item.artist || '';

        li.replaceChildren(number, copy, artist);
        return li;
      }));
    }

    function setSongCard(item, titleEl, artistEl) {
      titleEl.textContent = item?.title || 'Unknown title';
      const artist = item?.artist || '';
      const duration = item ? formatTrackTime(item) : '';
      artistEl.textContent = [artist, duration].filter(Boolean).join(' / ');
    }

    function renderNextList(items) {
      els.nextList.replaceChildren(...items.map((item) => {
        const li = document.createElement('li');

        const icon = document.createElement('span');
        icon.className = 'list-note';
        icon.textContent = '';

        const copy = document.createElement('span');
        copy.className = 'next-copy';

        const title = document.createElement('span');
        title.className = 'song-title';
        title.textContent = item.title || 'Unknown title';

        const artist = document.createElement('span');
        artist.className = 'song-artist';
        const duration = formatTrackTime(item);
        artist.textContent = [item.artist || '', duration].filter(Boolean).join(' / ');

        copy.replaceChildren(title, artist);
        li.replaceChildren(icon, copy);
        return li;
      }));
    }

    function maxNextItems() {
      return state.mode === 'maximized' && state.maximizedQueueMode === 'single'
        ? 1
        : state.upcomingTracks;
    }

    function updatePlaylist(data, trackChanged) {
      const items = Array.isArray(data.playlist) ? data.playlist : [];
      if (!items.length) {
        els.playlistPanel.classList.add('hidden');
        els.compactList.replaceChildren();
        els.nextList.replaceChildren();
        els.previousCard.classList.add('hidden');
        els.nextCard.classList.add('hidden');
        return;
      }

      const currentIndex = currentIndexFromData(data);
      const position = playlistPosition(items, currentIndex);
      const previous = position > 0 ? items[position - 1] : null;
      const nextCount = maxNextItems();
      const nextItems = position >= 0
        ? items.slice(position + 1, position + 1 + nextCount)
        : items.slice(0, nextCount);

      els.playlistPanel.classList.remove('hidden');
      els.playlistCount.textContent = `${items.length} ${items.length === 1 ? 'track' : 'tracks'}`;

      renderCompactList(items, currentIndex, position);

      if (previous) {
        els.previousCard.classList.remove('hidden');
        setSongCard(previous, els.previousTitle, els.previousArtist);
      } else {
        els.previousCard.classList.add('hidden');
      }

      if (nextItems.length) {
        els.nextCard.classList.remove('hidden');
        renderNextList(nextItems);
      } else {
        els.nextCard.classList.add('hidden');
        els.nextList.replaceChildren();
      }

      if (trackChanged) triggerCompactReveal();
    }

    function updateUI(data) {
      if (!data || !data.available) {
        const reason = data && data.diagnostic ? data.diagnostic : 'JSON data is not reachable yet.';
        setWaiting(reason);
        return;
      }

      state.currentData = data;
      const key = `${data.title || ''}|${data.artist || ''}|${data.album || ''}`;
      const trackChanged = key !== state.lastTrackKey;
      if (trackChanged) {
        els.card.classList.remove('track-change');
        void els.card.offsetWidth;
        els.card.classList.add('track-change');
        state.lastTrackKey = key;
      }

      const status = data.status || 'Unknown';
      els.card.classList.toggle('playing', status === 'Playing');
      els.card.classList.toggle('paused', status === 'Paused');
      els.card.classList.remove('waiting');

      els.title.textContent = data.title || 'Unknown title';
      els.artist.textContent = data.artist || 'Unknown artist';
      els.composer.textContent = data.composer || data.artist || '--';
      els.album.textContent = data.album || '--';
      els.footerText.textContent = data.backend || data.source_app_id
        ? `Playing from ${data.backend || data.source_app_id}.`
        : 'Playing from your selected music source.';

      const progress = Math.max(0, Math.min(1, Number(data.progress) || 0));
      const currentText = data.position_text || formatTime(data.position_ms);
      const durationText = data.duration_text || formatTime(data.duration_ms);
      updateProgress(progress, currentText, durationText);
      updatePlaylist(data, trackChanged);
    }

    function interpolateProgress() {
      if (!state.currentData || state.lastStatus !== 'Playing') return;
      if (state.lastDuration <= 0) return;

      const elapsed = Date.now() - state.lastPollTime;
      const position = Math.min(state.lastPosition + elapsed, state.lastDuration);
      const ratio = position / state.lastDuration;
      updateProgress(
        ratio,
        formatTime(position),
        state.currentData.duration_text || formatTime(state.lastDuration)
      );
    }

    async function poll() {
      const data = await fetchData();
      if (!data) {
        if (!state.idleTimer) {
          state.idleTimer = setTimeout(() => {
            setWaiting('Waiting for now-playing JSON.');
            state.idleTimer = null;
          }, DEFAULTS.idleAfterMs);
        }
        return;
      }

      if (state.idleTimer) {
        clearTimeout(state.idleTimer);
        state.idleTimer = null;
      }

      state.lastPollTime = Date.now();
      state.lastPosition = Number(data.position_ms) || 0;
      state.lastDuration = Number(data.duration_ms) || 0;
      state.lastStatus = data.status || '';
      updateUI(data);
    }

    async function boot() {
      const settings = await loadOverlayConfig();
      state.jsonUrl = settings.jsonUrl;
      applyOverlaySettings(settings);
      await poll();
      setInterval(poll, DEFAULTS.pollIntervalMs);
      setInterval(interpolateProgress, 33);
    }

    boot();
  </script>
</body>
</html>
